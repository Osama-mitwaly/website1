<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتجاتنا | نباتات الحياة</title>
    <!-- استدعاء خطوط جوجل وأيقونات Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- (ضع هنا نفس ملفات CSS الخاصة بالهيدر والفوتر والبطاقات التي تستخدمها في index.html) -->
    <style>
        /* ستايل أساسي للصفحة */
        body { font-family: 'Tajawal', sans-serif; margin: 0; background-color: #f9f9f9; color: #333; }
        .page-header { background-color: #082419; color: white; padding: 60px 20px; text-align: center; }
        .page-header h1 { margin: 0; font-size: 36px; color: #b87333; }
        
        /* أزرار الفلترة */
        .filter-container { text-align: center; margin: 40px 0; padding: 0 20px; }
        .filter-btn {
            background-color: white; border: 1px solid #ddd; padding: 10px 25px; 
            margin: 5px; border-radius: 30px; cursor: pointer; font-family: 'Tajawal', sans-serif;
            font-weight: bold; color: #333; transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active { background-color: #b87333; color: white; border-color: #b87333; }
        
        /* شبكة المنتجات (نفس ستايل index.html) */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
        .product-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; padding-bottom: 20px; }
        .product-card img { width: 100%; height: 250px; object-fit: cover; }
        .product-card h3 { color: #082419; margin: 15px 0 5px; }
        .product-card p { padding: 0 15px; color: #666; font-size: 14px; }
        .btn-whatsapp { display: inline-block; background-color: #25D366; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- الهيدر (انسخ الهيدر الخاص بك هنا) -->
    
    <div class="page-header">
        <h1>منتجاتنا من الطبيعة</h1>
        <p>اكتشف مجموعتنا المتنوعة من الأعشاب، التوابل، والبذور عالية الجودة</p>
    </div>

    <!-- أزرار الفلترة -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filterProducts('all')">الكل</button>
        <button class="filter-btn" onclick="filterProducts('herbs')">أعشاب</button>
        <button class="filter-btn" onclick="filterProducts('spices')">توابل</button>
        <button class="filter-btn" onclick="filterProducts('seeds')">بذور</button>
    </div>

    <!-- حاوية المنتجات -->
    <div class="products-grid" id="products-container">
        <!-- سيتم جلب المنتجات هنا بواسطة الجافاسكريبت -->
    </div>

    <!-- الفوتر (انسخ الفوتر الخاص بك هنا) -->

    <!-- استدعاء الجافاسكريبت (مهم جداً) -->
    <script type="module" src="js/dataFetcher.js"></script>

</body>
</html>
